name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.12 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Atualizar instalador
        run: python -m pip install --upgrade pip
      - name: Instalar PyTorch para CPU (Linux e Windows)
        if: runner.os != 'macOS'
        run: python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Instalar PyTorch (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install "torch>=2.6,<3"
      - name: Instalar dependências do laboratório
        run: python -m pip install -r requirements.txt
      - name: Executar testes com dados sintéticos
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Verificar download e treinamento mínimo com MNIST real (Linux)
        if: runner.os == 'Linux'
        run: python verificar_instalacao.py
